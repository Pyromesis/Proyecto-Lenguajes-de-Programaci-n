name: Verificación técnica AREPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      AREPA_SIN_VENTANA: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependencia fijada
        run: python -m pip install -r requirements.txt
      - name: Verificar gramática, documentación y pruebas
        run: python herramientas/verificar_entrega.py
      - name: Comprobar integridad de la entrega
        run: python herramientas/crear_entrega.py
